<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1020">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="Rivendex">
<link rel="stylesheet" href="stile.css">
<title>Rivendex</title>
</head>
<body>
<main class="wrap">
<a id="alertBar" class="panel hit" href="watchlist.html" style="display:none;margin-top:14px;color:inherit;text-decoration:none"></a>
<h2>Scegli il gioco</h2>
<div class="tiles" id="tiles"></div>
<p class="small muted">Per i giochi senza fonte di prezzi automatica inserisci tu i prezzi nel calcolatore.</p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="comune.js"></script>
<script src="giochi.js"></script>
<script src="watch.js"></script>
<script>$("tiles").innerHTML=Object.entries(GAMES).map(([k,g])=>`<a class="tile" href="gioco.html?g=${k}"><span>${g.emoji}</span><strong>${g.label}</strong><small>${g.manual?"prezzi manuali":"prezzi Cardmarket"}</small></a>`).join("");
window.onAuth=async()=>{
  const bar=$("alertBar");bar.style.display="none";if(!user)return;
  const show=r=>{const n=r.filter(below).length;if(n){bar.innerHTML=`🔔 <strong>${n}</strong> ${n===1?"carta è scesa":"carte sono scese"} sotto la tua soglia: vai alla watchlist`;bar.style.display="block"}};
  try{const r=await loadWatch();show(r);if(r.length&&!sessionStorage.getItem("wref")){sessionStorage.setItem("wref","1");show(await refreshWatch(r))}}catch{}
};
</script>
</body>
</html>
